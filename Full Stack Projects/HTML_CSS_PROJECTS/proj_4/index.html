<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <h1>Rock · Paper · Scissors</h1>

        <div class="score-board">
            <div>
                <h3>You</h3>
                <p id="user-score">0</p>
            </div>
            <div>
                <h3>Computer</h3>
                <p id="comp-score">0</p>
            </div>
        </div>

        <p class="status-text" id="status-text">Click any option to start!</p>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">✊ Rock</button>
            <button class="choice-btn" data-choice="paper">✋ Paper</button>
            <button class="choice-btn" data-choice="scissors">✌ Scissors</button>
        </div>

        <div class="result-box">
            <p><strong>Your choice:</strong> <span id="user-choice">-</span></p>
            <p><strong>Computer's choice:</strong> <span id="comp-choice">-</span></p>
            <p><strong>Result:</strong> <span id="round-result">-</span></p>
        </div>

        <button id="reset-btn" class="reset-btn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
